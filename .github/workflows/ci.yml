name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Use isolated configuration
        run: echo "RESY_DATA_DIR=$RUNNER_TEMP/resy-test-data" >> "$GITHUB_ENV"
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - run: python scripts/check_secrets.py
      - run: ruff check client server scripts tests start.py
      - run: ruff format --check client server scripts tests start.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pip check
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/ci.yml
      - run: pip-audit --disable-pip --no-deps -r requirements.lock
      - run: pip-audit --disable-pip --no-deps -r requirements-dev.lock
