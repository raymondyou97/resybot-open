name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    env:
      RESY_DATA_DIR: ${{ runner.temp }}/resy-test-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - run: python scripts/check_secrets.py
      - run: ruff check client server scripts tests start.py
      - run: ruff format --check client server scripts tests start.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pip check
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - run: pip-audit --disable-pip --no-deps -r requirements.lock
      - run: pip-audit --disable-pip --no-deps -r requirements-dev.lock
